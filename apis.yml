aid: think-parametric
name: Think Parametric
description: Think Parametric is an online learning platform for architecture, engineering,
  and design professionals, offering expert-led courses and professional certifications in
  computational and parametric design tools including Rhino, Grasshopper, Revit, Dynamo,
  SketchUp, and V-Ray. Membership plans give individuals and organizations access to a
  library of 60+ courses taught by practitioners from leading firms such as SOM, BIG,
  Gensler, AECOM, and Arup, alongside community forums, downloadable assets, and progress
  tracking. Backed by 500 Global.
